# Front web — production.
#
# Les VITE_* sont des ARGUMENTS DE BUILD, pas des variables d'exécution : Vite
# les fige dans le JavaScript livré au navigateur. Les placer sous `environment`
# n'aurait aucun effet, et l'application serait construite avec des valeurs
# vides sans qu'aucune erreur ne le signale.

services:
  app:
    build:
      context: .
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL-}
        VITE_DJANGO_API_URL: ${VITE_DJANGO_API_URL:?VITE_DJANGO_API_URL est obligatoire, sinon toutes les images seront cassées}
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Sans elle, le serveur refuse de démarrer plutôt que de servir
      # des données de démonstration.
      DJANGO_API_URL: ${DJANGO_API_URL:?DJANGO_API_URL est obligatoire en production}
    restart: always
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
